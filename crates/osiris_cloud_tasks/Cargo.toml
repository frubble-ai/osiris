wiremock = { workspace = true, optional = true }

[features]
# Cloud Tasks and Google's signing keys faked at the network (`mocks`), for tests.
testing = ["osiris_tasks/testing", "dep:aws-lc-rs", "dep:base64", "dep:google-cloud-auth", "dep:wiremock"]

[dev-dependencies]
rstest.workspace = true
osiris_cloud_tasks = { workspace = true, features = ["testing"] }
osiris_tasks = { workspace = true, features = ["testing"] }
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
wiremock.workspace = true
