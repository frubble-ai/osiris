# Weekly update suggestions, one pull request per ecosystem, as in frubble-ai/app. Actions are
# pinned to a commit SHA; Dependabot rewrites the SHA and its version comment together.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The rust and distroless base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: npm
    directory: /clients/typescript
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
