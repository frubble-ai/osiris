name: CI

on:
  # labeled and unlabeled too: the api-sunset label decides whether a release may be removed, and
  # a re-run reuses the event it started with.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  # A label change runs only the contract job, in a group of its own, so it never cancels a run of
  # the code's checks that it would then skip.
  group: ci-${{ github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'labels' || 'code' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: 8.30.1
  OASDIFF_VERSION: 1.35.0
  # The linux_amd64 tarball's SHA-256, pinned here rather than read from the release it comes with.
  OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
  # Queries are checked against the committed .sqlx/: no database needed to build.
  SQLX_OFFLINE: "true"

jobs:
  secret-scan:
    name: Security — Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The binary, not gitleaks-action: that action requires a paid licence for organisation
      # repositories. The same as frubble-ai/app's.
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          gitleaks git --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan the pushed history
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact --verbose

  quality:
    needs: secret-scan
    # A label change only re-runs the contract job, which reads the labels.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    name: Format, lint, dependencies, spelling, commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup show # installs the toolchain rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: typos,cocogitto
      - name: Spelling
        run: typos
      - name: No provider named outside its folders
        run: |
          python3 -m unittest scripts/test_placement_check.py
          python3 scripts/placement-check.py
      - name: Every commit is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q origin "$BASE_REF"
          cog check "origin/$BASE_REF..HEAD"

  test:
    needs: secret-scan
    # A label change only re-runs the contract job, which reads the labels.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    name: Tests
    runs-on: ubuntu-latest
    # The same Postgres as locally (docker-compose): TLS only, with a generated CA, and the same
    # DB_* variables osiris reads when deployed.
    env:
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: osiris
      DB_USER: osiris
      DB_PASSWORD: osiris_dev
      PUBSUB_EMULATOR_HOST: localhost:8086
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Postgres over TLS, and the Pub/Sub emulator with the events topic
        run: |
          docker compose up -d --wait postgres pubsub
          docker compose run --rm pubsub-setup
          {
            echo "DB_CA_PEM<<PEM"
            cat .local/tls/ca.pem
            echo "PEM"
            # sqlx's tools and test harness take a URL; osiris itself never reads it.
            echo "DATABASE_URL=postgres://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_NAME?sslmode=verify-ca&sslrootcert=$GITHUB_WORKSPACE/.local/tls/ca.pem"
          } >> "$GITHUB_ENV"
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest,sqlx-cli
      - name: Every migration applies, reverts and applies again
        run: |
          sqlx migrate run
          sqlx migrate revert --target-version 0
          sqlx migrate run
      - name: .sqlx/ matches the queries and the schema
        run: cargo sqlx prepare --workspace --check -- --all-targets
        env:
          SQLX_OFFLINE: "false"
      - run: cargo nextest run --workspace --locked
      # Every release's spec held against a live osiris: generated requests at each release and
      # each key, every answer checked against that release's spec, and no server error.
      - name: Schemathesis against every release
        run: |
          set -a; source .env.example; set +a
          cargo build --locked -q -p osiris_server
          # Installs Schemathesis from scripts/schemathesis/requirements.txt, every package pinned
          # by its hash.
          scripts/schemathesis/run.sh

  openapi:
    needs: secret-scan
    # A label change only re-runs the contract job, which reads the labels.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    name: OpenAPI matches the routes, for every release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A cached target/ may still hold the spec of a release removed since.
      - run: rm -rf target/api-reference && cargo run --locked -q -p osiris_openapi target/api-reference
      - run: diff -u api-reference/openapi.json target/api-reference/openapi.json
      - run: diff -ru api-reference/versions target/api-reference/versions

  contract:
    needs: secret-scan
    name: Stable releases break nothing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install oasdiff
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          tarball="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "$base/$tarball"
          echo "$OASDIFF_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" oasdiff
          sudo mv oasdiff /usr/local/bin/
      - name: The guard decides each case right
        run: python3 -m unittest scripts/test_api_contract_guard.py
      # A stable release's spec may only grow, and its golden transcripts never change. A release
      # is only removed past its sunset, in a pull request labelled api-sunset.
      - name: Every stable release's spec and transcripts, against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          OSIRIS_SUNSET: ${{ contains(github.event.pull_request.labels.*.name, 'api-sunset') }}
        # The base branch's guard judges the pull request, so a pull request can't weaken the check
        # it is held to; the first pull request to add the guard has no base copy and runs its own.
        run: |
          git fetch -q origin "$BASE_REF"
          guard="$RUNNER_TEMP/api-contract-guard.py"
          if ! git show "origin/$BASE_REF:scripts/api-contract-guard.py" > "$guard" 2>/dev/null; then
            cp scripts/api-contract-guard.py "$guard"
          fi
          python3 "$guard" "origin/$BASE_REF" oasdiff

  image:
    needs: secret-scan
    # A label change only re-runs the contract job, which reads the labels.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: osiris:ci
          build-args: OSIRIS_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs as non-root and refuses to start without OSIRIS_PROCESS
        run: |
          set -euo pipefail
          test "$(docker image inspect osiris:ci -f '{{.Config.User}}')" != ""
          test "$(docker image inspect osiris:ci -f '{{json .Config.Cmd}}')" = "null"
          if docker run --rm osiris:ci > out.txt 2>&1; then
            echo "::error::the image started without OSIRIS_PROCESS"; exit 1
          fi
          grep -q "OSIRIS_PROCESS is required" out.txt

  summary:
    name: Osiris - Code Quality Summary
    # Not on a label change: the code's jobs are skipped there, and a skip would read as a pass
    # over a code run that failed. The contract job reports on its own.
    if: always() && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    needs: [secret-scan, quality, test, openapi, contract, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to have passed
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::failed or cancelled: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "all checks passed or were not needed"
