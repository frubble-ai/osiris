name: Osiris - CD

# Two targets, picked by the branch the run is on: `stg` deploys to stg, in the
# `osiris-stg` environment; every other branch deploys to dev, in `osiris-dev`.
# A push to `dev` deploys dev, and a run by hand from any branch (Actions → Run
# workflow → "Use workflow from" that branch, or `gh workflow run osiris-cd.yml
# --ref my-branch`) deploys that branch to dev. Nothing but the `stg` branch can
# reach stg: the target is stg only when the run is on `stg`, `osiris-stg`
# accepts deployments from `stg` only, and Google trusts stg's deploy from
# `refs/heads/stg` only. `prd` and tags are refused.
#
# The file name, the environment and, for stg, the branch are all part of the
# identity the platform repository trusts (repository|workflow|environment|ref;
# for dev, any branch). Renaming this file, or moving it, makes the Google
# sign-in fail. The environment is named after the component because its name
# is what GitHub lists the deployment under.
#
# The path filter is safe here, unlike on the quality workflow: nothing waits
# on this run as a required check. A push that touches none of these — a
# docs-only change — has nothing new to deploy. Migrations are in the filter
# because sqlx compiles them into the binary.
#
# workflow_dispatch also redeploys `stg` or `dev` on demand, for a change the
# path filter skips.
on:
  workflow_dispatch:
  push:
    branches: [stg, dev]
    paths:
      - crates/**
      - migrations/**
      - .sqlx/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - Dockerfile
      - .dockerignore
      - .github/workflows/osiris-cd.yml
      - .github/scripts/deploy/**
      - .github/actions/install-trivy/**

# One rollout at a time per environment, never interrupted: Cloud Run keeps
# the previous revision serving until the new one is healthy, but two rollouts
# racing would leave the verification below checking the wrong one. The group
# is the target, so every branch deployed to dev queues behind the others.
concurrency:
  group: osiris-cd-${{ github.ref == 'refs/heads/stg' && 'stg' || 'dev' }}
  cancel-in-progress: false
  # Every pending run waits its turn. With the default (`single`), a new run
  # would cancel the one pending, so a branch run could drop a queued push
  # to `dev` and leave dev on the branch. Same setting as the application's
  # backend-cd. actionlint 1.7.12 still rejects the key; .github/actionlint.yaml
  # ignores that one message.
  queue: max

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.76.1

jobs:
  # Stg is switched off (its infra destroyed) only when the STG_ENABLED
  # repository variable is exactly `false`; unset or anything else means on.
  # Checked in the shell because expression `==` ignores case. Runs that
  # target stg while it is off are skipped, not failed; dev is never gated.
  # Keep this value in step with frubble-ai/platform's STG_ENABLED.
  stg-switch:
    name: stg switch
    if: vars.OSIRIS_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check STG_ENABLED
        id: check
        env:
          STG_ENABLED: ${{ vars.STG_ENABLED }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/stg" ] && [ "$STG_ENABLED" = "false" ]; then
            echo "::notice::stg is switched off (STG_ENABLED=false); skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  # No cloud credentials here. The image is built and scanned first, and only
  # an image that passed reaches the job that can push it. It is tagged by
  # commit only; the registry path is the deploy job's. Nothing
  # environment-specific is baked in: the commit build argument is what
  # /health reports.
  build:
    name: build
    needs: stg-switch
    if: needs.stg-switch.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Before anything else: a tag or `prd` would otherwise be built for dev.
      - name: Refuse a tag or prd
        if: github.ref_type != 'branch' || github.ref == 'refs/heads/prd'
        run: |
          echo "::error::Deploys run from a branch: stg deploys to stg, any other branch but prd to dev."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: frubble-osiris:${{ github.sha }}
          build-args: OSIRIS_COMMIT=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: ./.github/actions/install-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan image
        run: trivy image --input "${{ runner.temp }}/image.tar" --severity CRITICAL --exit-code 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Where it deploys to comes from the `osiris-stg` or `osiris-dev`
  # environment's variables. A prd deploy still changes the target expression
  # here and in the build, and the trust rule on the platform side, which
  # names the environment. The workflow sets no command and no arguments:
  # serve, worker and migrate already have OSIRIS_PROCESS.
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: osiris-${{ github.ref == 'refs/heads/stg' && 'stg' || 'dev' }}
    permissions:
      contents: read
      id-token: write # the OIDC token Workload Identity Federation exchanges
    env:
      # Same registry as the application. The image name is its own, so a
      # backend tag is never overwritten.
      IMAGE: ${{ vars.GCP_REGISTRY }}/frubble-osiris:${{ github.sha }}
      LOCAL_IMAGE: frubble-osiris:${{ github.sha }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_RUN_SERVICE }}
      # The migration job and the worker service, both on the same image.
      MIGRATE_JOB: ${{ vars.GCP_RUN_JOB_MIGRATE }}
      WORKER_SERVICE: ${{ vars.GCP_RUN_SERVICE_WORKER }}
      # modules/naming `osiris_hostname`: osiris.dev.frubble.ai on dev,
      # osiris.stg.frubble.ai on stg. Derived here. A copy of backend-dev's
      # API_HOSTNAME is the application's API (api.dev.frubble.ai), so the
      # commit check would ask the wrong host.
      API_HOSTNAME: osiris.${{ github.ref == 'refs/heads/stg' && 'stg' || 'dev' }}.frubble.ai
      COMMIT: ${{ github.sha }}
    steps:
      # A re-run of this job alone reuses stg-switch's old output, so the
      # switch is read again here, before any credentials.
      - name: Refuse stg while it is switched off
        env:
          STG_ENABLED: ${{ vars.STG_ENABLED }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/stg" ] && [ "$STG_ENABLED" = "false" ]; then
            echo "::error::stg was switched off after this run started (STG_ENABLED=false)."
            exit 1
          fi

      # Names only. An empty one fails in the script that uses it; this
      # fails first, before any credential is used, and names every
      # variable that is missing.
      - name: Require the environment's variables
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          WIF_AUDIENCE: ${{ vars.GCP_WIF_AUDIENCE }}
          DEPLOY_HUB: ${{ vars.GCP_DEPLOY_HUB }}
          DEPLOY_SPOKE: ${{ vars.GCP_DEPLOY_SPOKE }}
          REGISTRY: ${{ vars.GCP_REGISTRY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$WIF_PROVIDER" ] || missing+=(GCP_WIF_PROVIDER)
          [ -n "$WIF_AUDIENCE" ] || missing+=(GCP_WIF_AUDIENCE)
          [ -n "$DEPLOY_HUB" ] || missing+=(GCP_DEPLOY_HUB)
          [ -n "$DEPLOY_SPOKE" ] || missing+=(GCP_DEPLOY_SPOKE)
          [ -n "$REGISTRY" ] || missing+=(GCP_REGISTRY)
          [ -n "$PROJECT" ] || missing+=(GCP_PROJECT_ID)
          [ -n "$REGION" ] || missing+=(GCP_REGION)
          [ -n "$SERVICE" ] || missing+=(GCP_RUN_SERVICE)
          [ -n "$MIGRATE_JOB" ] || missing+=(GCP_RUN_JOB_MIGRATE)
          [ -n "$WORKER_SERVICE" ] || missing+=(GCP_RUN_SERVICE_WORKER)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::the environment is missing: ${missing[*]}"
            exit 1
          fi

      # For the scripts only; no credentials are kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      # Google trusts a dev deploy only from frubble-ai's members, by the
      # run's actor (platform, dev/gcp/trust.tf). A re-run keeps the original
      # actor, so it would pass for whoever re-runs it: on dev, only the person
      # who started the run may re-run it. Anyone else starts a new run.
      - name: Refuse a dev re-run by someone else
        if: github.ref != 'refs/heads/stg' && github.triggering_actor != github.actor
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::$TRIGGERING_ACTOR re-ran a dev deploy $ACTOR started. Start a new run instead."
          exit 1

      # Signs in as the hub, which holds no permissions of its own. Its only
      # capability is impersonating the spoke, which is what is set next.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_HUB }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # From here every gcloud call runs as the spoke, and so does docker:
      # its credential helper asks gcloud for the token.
      - name: Impersonate the deploy spoke
        run: gcloud config set auth/impersonate_service_account "${{ vars.GCP_DEPLOY_SPOKE }}"

      # For the re-run case below, where the image deployed is the one already
      # in the registry rather than the one scanned above.
      - uses: ./.github/actions/install-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}

      # A tag is pushed once: a re-run of a commit that was already pushed
      # reuses its image instead of pushing over it, after scanning that image
      # with today's rules.
      - name: Push the image
        env:
          IMAGE_TAR: ${{ runner.temp }}/image.tar
        run: .github/scripts/deploy/push-image.sh

      # The schema first: the migration job runs on the new image and the
      # deploy stops here if it fails, with both services still on the
      # previous image.
      - name: Migrate the database
        run: .github/scripts/deploy/migrate.sh

      # timeout-minutes cancels this job while a Cloud Run execution can still
      # be going. Stay in the concurrency group until that execution has stopped.
      - name: Stop the migration if this job is no longer waiting
        if: cancelled()
        run: .github/scripts/deploy/cancel-execution.sh

      # A new revision with this image and nothing else changed; the service
      # definition is the platform repository's. Traffic moves only once the
      # revision is healthy, and the public hostname is then asked which
      # commit it serves.
      - name: Roll out serve and verify
        run: |
          : "${API_HOSTNAME:?API_HOSTNAME is required to verify the serve rollout}"
          .github/scripts/deploy/rollout.sh

      # The worker has no public name: its rollout is done once the revision
      # on the new image is ready and holds the traffic.
      - name: Roll out the worker
        env:
          SERVICE: ${{ env.WORKER_SERVICE }}
          API_HOSTNAME: ""
        run: .github/scripts/deploy/rollout.sh
