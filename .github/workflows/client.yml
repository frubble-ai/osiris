name: Osiris Client - CD Publish

# The TypeScript client (clients/typescript): its generated code matches the committed spec and
# it builds. A push to dev, stg or prd publishes a prerelease on that dist-tag. A release tag
# (`v1.2.3`) publishes that version on latest.
#
# A branch push publishes only when it changes the spec, the client or this file, so the channel
# points at the last commit that changed the client. A later push that leaves the client alone
# starts no run, so a publish still in progress moves the channel unless a later commit changed
# the client too. GitHub does not apply the path filter to a tag push, so every release tag still
# publishes.
on:
  pull_request:
    paths: ["api-reference/**", "clients/typescript/**", ".github/workflows/client.yml"]
  push:
    branches: [dev, stg, prd]
    tags: ["v*"]
    paths: ["api-reference/**", "clients/typescript/**", ".github/workflows/client.yml"]

permissions:
  contents: read

jobs:
  # Pull requests and branch pushes: read-only, with no credentials left behind for npm's
  # install scripts.
  client:
    name: TypeScript client
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: The generated code matches the spec, and it builds
        run: npm run check && npm run build

  # Push only. The trigger lists dev, stg, prd, and v* tags; a pull request does not publish.
  publish:
    name: Publish the TypeScript client
    if: github.event_name == 'push'
    concurrency:
      group: client-publish-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # A stalled npm or GitHub API call ends here. A version uploaded before the stall stays
    # published, and its channel is moved by hand with `npm dist-tag add`.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@frubble-ai"
      - run: npm ci
      - run: npm run check && npm run build
      - name: Publish on this ref's dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: node publish-release.mjs
