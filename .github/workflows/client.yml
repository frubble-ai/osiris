name: Client

# The TypeScript client (clients/typescript): its generated code matches the committed spec and
# it builds. On a release tag (`v1.2.3`) it is published to GitHub Packages at that version.
on:
  pull_request:
    paths: ["api-reference/**", "clients/typescript/**", ".github/workflows/client.yml"]
  push:
    branches: [dev]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Pull requests and dev: read-only, with no credentials left behind for npm's install scripts.
  client:
    name: TypeScript client
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: The generated code matches the spec, and it builds
        run: npm run check && npm run build

  # A release tag only: the one job that may publish.
  publish:
    name: Publish the TypeScript client
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@frubble-ai"
      - run: npm ci
      - run: npm run check && npm run build
      - name: Publish at the tag's version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          npm version --no-git-tag-version "${TAG#v}"
          npm publish
