name: Client

# The TypeScript client (clients/typescript): its generated code matches the committed spec and
# it builds. A push to dev, stg or prd publishes a prerelease on that dist-tag. A release tag
# (`v1.2.3`) publishes that version on latest.
on:
  pull_request:
    paths: ["api-reference/**", "clients/typescript/**", ".github/workflows/client.yml"]
  push:
    branches: [dev, stg, prd]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Pull requests and branch pushes: read-only, with no credentials left behind for npm's
  # install scripts.
  client:
    name: TypeScript client
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: The generated code matches the spec, and it builds
        run: npm run check && npm run build

  # dev, stg, prd, or a release tag.
  publish:
    name: Publish the TypeScript client
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/stg' ||
      github.ref == 'refs/heads/prd' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@frubble-ai"
      - run: npm ci
      - run: npm run check && npm run build
      - name: Publish on this ref's dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            dist_tag=latest
          else
            case "$REF_NAME" in
              dev|stg|prd) ;;
              *) echo "::error::refused to publish from ${REF_NAME}"; exit 1 ;;
            esac
            base=$(node -p "require('./package.json').version")
            sha=$(printf '%s' "$SHA" | cut -c1-12)
            version="${base}-${REF_NAME}.g${sha}"
            dist_tag="$REF_NAME"
          fi
          npm version --no-git-tag-version "$version"
          npm publish --tag "$dist_tag"
          echo "published @frubble-ai/osiris-client@${version} on ${dist_tag}"
